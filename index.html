<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050509">
  <title>Love You 💙</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; min-height: 100%; overflow: hidden;
      background: #050509; color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    body { min-height: 100svh; }
    canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block;
    }
    .controls {
      position: fixed; z-index: 2; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; flex-direction: column;
      align-items: center; gap: 9px; width: min(92vw, 420px); text-align: center;
    }
    button {
      border: 1px solid rgba(110,190,255,.75); border-radius: 999px;
      padding: 12px 20px; color: white; font-size: 15px; font-weight: 700;
      background: rgba(10,35,75,.88); box-shadow: 0 0 20px rgba(30,144,255,.25);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.98); }
    #hint { color: rgba(225,239,255,.75); font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Corazón animado con las palabras Love You"></canvas>
  <div class="controls">
    <button id="musicButton" type="button">▶ Toca para escuchar la música</button>
    <div id="hint">Con cariño 💙</div>
  </div>
  <audio id="music" src="love_you.mp3" preload="auto" loop></audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");
    const hint = document.getElementById("hint");

    let w = 0, h = 0, dpr = 1, particles = [], frame = 0;
    const colors = ["#4682b4", "#1e90ff", "#00bfff", "#6495ed", "#4169e1"];
    const words = ["love you", "Love You", "LOVE YOU"];

    function heartPoint(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t))
      };
    }
    function screenPoint(x, y) {
      const scale = Math.min(w / 42, h / 34, 19);
      return { x: w/2 + x*scale, y: h*0.46 + y*scale, scale };
    }
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.round(w*dpr);
      canvas.height = Math.round(h*dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeParticles();
    }
    function makeParticles() {
      particles = [];
      // Heart outline
      const count = Math.max(90, Math.min(190, Math.floor(w / 4.5)));
      for (let i=0; i<count; i++) {
        const t = i/count * Math.PI*2;
        const p = heartPoint(t);
        const pos = screenPoint(p.x, p.y);
        particles.push({
          x: pos.x, y: pos.y, delay: i*1.4,
          word: words[i % words.length], color: colors[i % colors.length],
          size: Math.max(9, Math.min(15, w/34)), alpha: 0, phase: Math.random()*6.28
        });
      }
      // A lighter scatter inside the heart
      const fillCount = Math.max(28, Math.min(65, Math.floor(w / 11)));
      for (let i=0; i<fillCount; i++) {
        const t = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*.78;
        const p = heartPoint(t);
        const pos = screenPoint(p.x*r, p.y*r);
        particles.push({
          x: pos.x, y: pos.y, delay: 110+i*4,
          word: words[(i+1) % words.length], color: colors[(i+2) % colors.length],
          size: Math.max(8, Math.min(12, w/39)), alpha: 0, phase: Math.random()*6.28
        });
      }
    }
    function draw() {
      frame++;
      ctx.clearRect(0, 0, w, h);
      // soft blue ambient glow
      const glow = ctx.createRadialGradient(w/2, h*.44, 5, w/2, h*.44, Math.min(w,h)*.48);
      glow.addColorStop(0, "rgba(0,80,180,.12)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow; ctx.fillRect(0,0,w,h);

      for (const p of particles) {
        if (frame > p.delay) p.alpha = Math.min(1, p.alpha + .045);
        if (p.alpha <= 0) continue;
        const flicker = .78 + .22*Math.sin(frame*.045+p.phase);
        ctx.save();
        ctx.globalAlpha = p.alpha*flicker;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = `bold ${p.size}px Arial, sans-serif`;
        ctx.shadowColor = p.color; ctx.shadowBlur = 12;
        ctx.fillStyle = p.color; ctx.fillText(p.word, p.x, p.y);
        ctx.restore();
      }

      const finished = frame > 260;
      if (finished) {
        const pulse = 1 + .025*Math.sin(frame*.05);
        ctx.save();
        ctx.globalAlpha = Math.min(1, (frame-260)/60);
        ctx.translate(w/2, h*.46);
        ctx.scale(pulse,pulse);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = `bold ${Math.max(25, Math.min(48, w/9))}px Georgia, serif`;
        ctx.shadowColor = "#eaf5ff"; ctx.shadowBlur = 18;
        ctx.fillStyle = "#fffaf5"; ctx.fillText("Love You", 0, 0);
        ctx.restore();
      }
      requestAnimationFrame(draw);
    }
    musicButton.addEventListener("click", async () => {
      try {
        if (music.paused) {
          await music.play();
          musicButton.textContent = "❚❚ Pausar música";
          hint.textContent = "Disfruta 💙";
        } else {
          music.pause();
          musicButton.textContent = "▶ Reproducir música";
        }
      } catch (e) {
        hint.textContent = "No se encontró love_you.mp3. Revisa que esté junto a index.html.";
      }
    });
    music.addEventListener("error", () => {
      hint.textContent = "Pon el audio love_you.mp3 en la misma carpeta que esta página.";
    });
    window.addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
